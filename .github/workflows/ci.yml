name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run check:contrast

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run test:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run seo:check
      - uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: out/
          retention-days: 1

  e2e-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/
      # @lhci/cli pins Lighthouse 12.6.1, whose robots-txt audit rejects the
      # Content-Signal directive. Install it in an isolated prefix with a
      # Lighthouse 13 override (13.x accepts content-signal).
      - name: Install Lighthouse CI
        run: |
          mkdir -p "$RUNNER_TEMP/lhci" && cd "$RUNNER_TEMP/lhci"
          npm init -y > /dev/null
          npm pkg set "overrides.lighthouse=^13"
          npm install @lhci/cli "lighthouse@^13"
          echo "$RUNNER_TEMP/lhci/node_modules/.bin" >> "$GITHUB_PATH"
      - run: lhci autorun
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7
